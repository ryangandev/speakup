[project]
name = "speakup-server"
version = "0.1.0"
description = "SpeakUp analysis server and the M0 speech-to-text bake-off"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28",
    "numpy>=2.0",
    "soundfile>=0.13",
    "silero-vad>=6.2",
    "torch>=2.6",
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "praat-parselmouth>=0.4.5",
]

[project.optional-dependencies]
# Local CrisperWhisper. Its fast CTranslate2 backend ships Linux wheels only, so macOS uses
# the PyTorch (transformers) backend. Model weights download on first run (several GB).
# transformers 5.22 breaks Whisper generation ('EncoderDecoderCache' object has no attribute
# 'layers' in its stop check), so stay on 4.x until a 5.x release is verified.
crisper = ["crisperwhisper[transformers]>=2.0.4", "transformers>=4.57,<5"]
# Local Qwen3-ASR with Qwen3-ForcedAligner, the engine for Mandarin takes. qwen-asr pins
# transformers 4.57.6, inside crisper's range. Weights download on first run: about 4.7 GB for
# the 1.7B model (1.9 GB for 0.6B) plus 1.8 GB for the aligner.
qwen = ["qwen-asr>=0.0.6"]

[project.scripts]
speakup-bakeoff = "speakup.bakeoff.cli:main"
speakup-server = "speakup.api.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speakup"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
